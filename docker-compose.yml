services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hyrox
      POSTGRES_PASSWORD: hyrox
      POSTGRES_DB: hyrox_sponsor
    ports:
      - '5435:5432'
    volumes:
      - hyrox_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hyrox
      MINIO_ROOT_PASSWORD: hyrox-secret
    ports:
      - '9005:9000'
      - '9006:9001'
    volumes:
      - hyrox_minio_data:/data

volumes:
  hyrox_postgres_data:
  hyrox_minio_data:
